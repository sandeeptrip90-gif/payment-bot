<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>slice – Payment Successful</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f6fa;
      --ink: #111111;
      --muted: #9a9aa3;
      --muted-2: #b3b3bb;
      --line: #ececef;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 412px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 40px 18px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, #f8f9fd 0%, #f3f4f8 55%, #f6f4fb 100%);
    }

    /* ── Demo overlay ── */
    .demo-overlay {
      display:none;
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      overflow: hidden;
    }

    .demo-overlay span {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-26deg);
      font-size: 68px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: rgba(185, 28, 28, 0.20);
      border: 5px solid rgba(185, 28, 28, 0.26);
      padding: 2px 16px 8px;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      user-select: none;
      border-radius: 4px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      flex: 0 0 auto;
      margin-bottom: 16px;
      position: relative;
      z-index: 3;
    }

    .header p {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted-2);
      line-height: 1;
    }

    .header img {
      display: block;
      height: 28px;
      width: auto;
      margin: 10px auto 0;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      background: #ffffff;
      border-radius: 40px;
      padding: 28px 22px 72px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(196, 164, 255, 0.32),
        0 10px 28px rgba(176, 140, 255, 0.14),
        0 0 52px rgba(206, 170, 255, 0.34);
    }

    .card > p:first-child {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 16px;
    }

    .success-mark {
      width: 74px;
      height: 74px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(155deg, #c6f36a 0%, #7ee35c 36%, #2fd15a 72%, #16a34a 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.26);
    }

    .success-mark svg {
      width: 36px;
      height: 36px;
      display: block;
    }

    .amount {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1;
      color: #111;
      margin-bottom: 12px;
    }

    .receiver_name {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
      color: #111;
      margin-bottom: 5px;
    }

    .receiver_upi {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .datetime_formatted {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .card hr {
      border: 0;
      height: 1px;
      background: var(--line);
      margin: 0 10px 18px;
    }

    .payer_name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      color: #111;
      margin-bottom: 5px;
    }

    .payer_upi {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .utr {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Footer / logos ── */
    .footer {
      position: relative;
      z-index: 4;
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 22px;
    }

    .footer .upi {
      width: 48px;
      height: auto;
      display: block;
      position: relative;
      z-index: 6;
      margin-bottom: 40px;
    }

    .coins-left,
    .coins-right {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    .coins-left {
      left: -54px;
      bottom: -40px;
      width: 200px;
    }

    .coins-right {
      right: -12px;
      bottom: -16px;
      width: 148px;
    }

    .coins-left img,
    .coins-right img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-height: 740px) {
      .page { padding-top: 24px; }
      .header { margin-bottom: 10px; }
      .card { padding: 18px 18px 48px; }
      .success-mark { width: 58px; height: 58px; margin-bottom: 12px; }
      .amount { font-size: 38px; }
    }

    @media (max-width: 340px) {
      .amount { font-size: 36px; }
      .header img { height: 30px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="demo-overlay" aria-hidden="true"><span>DEMO</span></div>

    <header class="header">
      <p>PAID SECURELY ON</p>
      <img src="assets/slice-logo.png" alt="slice" />
    </header>

    <article class="card">
      <p>PAYMENT SUCCESSFUL</p>

      <div class="success-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5.2 12.6 9.7 17.1 18.8 7.4" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="amount">₹1,183</div>
      <div class="receiver_name">To Adhyayan Thakur</div>
      <div class="receiver_upi">9891320029@mbk</div>
      <div class="datetime_formatted">16 Apr ’26, 11:00 pm</div>
      <hr />
      <div class="payer_name">From slice savings</div>
      <div class="payer_upi">xx1725</div>
      <div class="utr">RRN: 610655950401</div>
    </article>

    <footer class="footer">
      <img class="upi" src="assets/upi-logo.png" alt="UPI" />
    </footer>

    <div class="coins-left" aria-hidden="true">
      <img src="assets/slice-coins-left.png" alt="" />
    </div>
    <div class="coins-right" aria-hidden="true">
      <img src="assets/slice-coins-right.png" alt="" />
    </div>
  </main>
</body>
</html>
