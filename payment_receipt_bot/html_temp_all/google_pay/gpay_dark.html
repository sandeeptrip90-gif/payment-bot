<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Payment successful</title>
<style>
  @font-face {
    font-family: 'Google Sans';
    font-style: normal;
    font-weight: 400;
    src: local('Google Sans'), local('Google Sans Regular'), local('GoogleSans-Regular'),
         url('https://fonts.cdnfonts.com/s/14955/ProductSans-Regular.woff') format('woff');
  }
  @font-face {
    font-family: 'Google Sans';
    font-style: normal;
    font-weight: 500;
    src: local('Google Sans Medium'), local('GoogleSans-Medium'),
         url('https://fonts.cdnfonts.com/s/14955/ProductSans-Medium.woff') format('woff');
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1f1f1f;
  }

  body {
    font-family: 'Google Sans', 'Google Sans Text', 'Segoe UI', Arial, sans-serif;
    font-weight: 400;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Layout tuned to ref 736×1341 (download (1).jpg) */
  .page {
    width: 100%;
    max-width: 368px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: 0 20px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
  }

  .success-icon {
    width: 88px;
    height: 88px;
    margin-top: clamp(28px, 9vh, 56px);
    flex: 0 0 auto;
  }
  .success-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .amount {
    margin-top: 28px;
    font-size: 38px;
    font-weight: 400;
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: #e8e8e8;
    white-space: nowrap;
  }

  .paid-line {
    margin: 14px 0 0;
    font-size: 19px;
    font-weight: 400;
    line-height: 1.35;
    color: #ffffff;
  }

  .receiver_upi {
    margin: 6px 0 0;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.4;
    color: #bbbbbb;
    word-break: break-all;
  }

  .meta-block {
    margin-top: auto;
    width: 100%;
    padding-top: 12px;
    padding-bottom: 8px;
    flex: 0 0 auto;
  }

  .datetime_formatted {
    margin: 0;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.45;
    color: #bbbbbb;
  }

  .utr-line {
    margin: 8px 0 0;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.45;
    color: #bbbbbb;
  }

 
</style>
</head>
<body>

  <main class="page">

    <!-- Success mark (graphic only — not a bank / UPI / GPay logo) -->
    <div class="success-icon" aria-hidden="true">
      <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
        <circle cx="48" cy="48" r="48" fill="#1973ed"/>
        <path d="M27 48.5 41.5 63 69 33.5" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="amount">₹300.00</div>

    <p class="paid-line">Paid to <span class="receiver_name">PaytmUser</span></p>

    <p class="receiver_upi">9486509932337@paytm</p>

    <div class="meta-block">
      <p class="datetime_formatted">February 16, 2024 2:40 PM</p>
      <p class="utr-line">UPI transaction ID: <span class="utr">441381619972</span></p>
    </div>

  </main>
</body>
</html>
